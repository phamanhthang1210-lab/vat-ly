<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Trắc Nghiệm Vật Lí</title>

  <!-- KaTeX kết xuất công thức Vật lí -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- PapaParse: Thư viện siêu nhẹ đọc dữ liệu từ Google Sheets -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 24px;
      font-size: 1.5rem;
    }
    .loading-text {
      text-align: center;
      color: #64748b;
      font-style: italic;
      padding: 20px;
    }
    .question-card {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .question-title {
      font-weight: 600;
      margin-bottom: 12px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .option-label:hover {
      background-color: #f1f5f9;
    }
    .option-label input {
      margin-right: 12px;
    }
    .explanation {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #eff6ff;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .result-box {
      display: none;
      text-align: center;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .correct {
      background-color: #dcfce7 !important;
      border-color: var(--success) !important;
      font-weight: 600;
    }
    .wrong {
      background-color: #fee2e2 !important;
      border-color: var(--danger) !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ôn Tập Trắc Nghiệm Vật Lí</h1>
    <div id="result" class="result-box"></div>
    <div id="quiz-container">
      <div class="loading-text">Đang tải đề thi từ Google Sheets...</div>
    </div>
    <button id="submit-btn" class="btn" onclick="submitQuiz()" style="display: none;">Nộp bài</button>
  </div>

  <script>
    // ==============================================================
    // THAY MÃ SHEET_ID CỦA BẠN VÀO DÒNG DƯỚI ĐÂY:
    // ==============================================================
    const SHEET_ID = "1HLXGp5PWCqUB6oSeauhyoOmjbbEeauLgYkQa0o3teGo";

    // Đường link trích xuất dữ liệu trực tiếp từ Google Sheet
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let quizData = [];

    // Tự động tải dữ liệu từ Google Sheets khi mở web
    function fetchQuestionsFromGoogleSheet() {
      Papa.parse(SHEET_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          // Ánh xạ đáp án chữ (A, B, C, D) thành số (0, 1, 2, 3)
          const answerMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };

          quizData = results.data.map(row => {
            const rawAns = (row['Đáp án đúng'] || '').trim().toUpperCase();
            return {
              question: row['Câu hỏi'] || '',
              options: [
                row['Đáp án A'] || '',
                row['Đáp án B'] || '',
                row['Đáp án C'] || '',
                row['Đáp án D'] || ''
              ],
              answer: answerMap[rawAns] !== undefined ? answerMap[rawAns] : 0,
              explanation: row['Lời giải'] || 'Chưa có lời giải chi tiết.'
            };
          }).filter(q => q.question !== ''); // Lọc bỏ dòng trống

          renderQuiz();
        },
        error: function(err) {
          document.getElementById("quiz-container").innerHTML = 
            "<div style='color:red; text-align:center;'>Không thể tải câu hỏi từ Google Sheets. Vui lòng kiểm tra lại quyền chia sẻ file!</div>";
        }
      });
    }

    // Hiển thị câu hỏi ra màn hình
    function renderQuiz() {
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";

      quizData.forEach((q, index) => {
        const qDiv = document.createElement("div");
        qDiv.className = "question-card";

        let optionsHtml = "";
        q.options.forEach((opt, optIndex) => {
          optionsHtml += `
            <label class="option-label" id="opt-label-${index}-${optIndex}">
              <input type="radio" name="question-${index}" value="${optIndex}">
              <span>${opt}</span>
            </label>
          `;
        });

        qDiv.innerHTML = `
          <div class="question-title">${q.question}</div>
          <div class="options">${optionsHtml}</div>
          <div class="explanation" id="exp-${index}">
            <strong>Lời giải:</strong> ${q.explanation}
          </div>
        `;
        container.appendChild(qDiv);
      });

      // Hiển thị nút nộp bài sau khi đã tải xong câu hỏi
      document.getElementById("submit-btn").style.display = "block";

      // Kích hoạt KaTeX kết xuất công thức Vật lí
      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    }

    // Chấm điểm và hiển thị kết quả
    function submitQuiz() {
      let score = 0;

      quizData.forEach((q, index) => {
        const selected = document.querySelector(`input[name="question-${index}"]:checked`);
        const expDiv = document.getElementById(`exp-${index}`);
        if (expDiv) expDiv.style.display = "block";

        const correctLabel = document.getElementById(`opt-label-${index}-${q.answer}`);
        if (correctLabel) correctLabel.classList.add("correct");

        if (selected) {
          const val = parseInt(selected.value);
          if (val === q.answer) {
            score++;
          } else {
            const wrongLabel = document.getElementById(`opt-label-${index}-${val}`);
            if (wrongLabel) wrongLabel.classList.add("wrong");
          }
        }
      });

      const resultBox = document.getElementById("result");
      resultBox.style.display = "block";
      const isPassed = score >= quizData.length / 2;
      resultBox.style.backgroundColor = isPassed ? "#dcfce7" : "#fee2e2";
      resultBox.style.color = isPassed ? "#15803d" : "#b91c1c";
      resultBox.innerHTML = `Bạn đạt: ${score} / ${quizData.length} điểm`;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Đã hoàn thành";

      document.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);
    }

    // Bắt đầu tải dữ liệu khi trang mở ra
    window.onload = fetchQuestionsFromGoogleSheet;
  </script>

</body>
</html>
